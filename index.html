<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Todo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="inputsearch">
      <input id="searchInput" type="text" placeholder="Поиск...">
    </div>
    
    <div class="container">
      <h1>Todo List</h1>
      
      <div class="controls">
        <input id="input" type="text" placeholder="Введите задачу..." />
        <button id="btn">Добавить</button>
      </div>

      <ul id="list"></ul>
      <p>Всего задач: <span id="counter"></span></p>
      <p>Выполненных задач: <span id="counterDone"></span></p>
      <div class="deleteAll">
        <button id="clearAll">Удалить всё</button>
      </div>
      <div class="filter">
          <button id="allBtn">Все</button>
          <button id="activeBtn">Активные</button>
          <button id="completedBtn">Выполненные</button>
        </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
